<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniAgent Ops • Portal de Autoservicio</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { width: 100%; max-width: 800px; margin-bottom: 25px; border-bottom: 1px solid #1e293b; padding-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        h1 { color: #38bdf8; font-size: 20px; margin: 0; }
        .form-container { width: 100%; max-width: 800px; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid #334155; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #cbd5e1; font-weight: 600; }
        input, textarea { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #f8fafc; font-size: 14px; box-sizing: border-box; }
        input:focus, textarea:focus { outline: none; border-color: #38bdf8; }
        textarea { resize: vertical; height: 120px; }
        button { background-color: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s; }
        button:hover { background-color: #1d4ed8; }
        .nav-links { display: flex; gap: 15px; }
        .nav-link { color: #38bdf8; text-decoration: none; font-size: 14px; font-weight: 600; }
        .nav-link:hover { text-decoration: underline; }
        #mensajeExito { display: none; margin-top: 15px; padding: 12px; background: #065f46; color: #a7f3d0; border-radius: 8px; text-align: center; font-size: 14px; font-weight: 600; }
    </style>
</head>
<body>

<header>
    <h1>🌐 OmniAgent Ops • Portal de Autoservicio</h1>
    <div class="nav-links">
        <a href="dashboard.html" class="nav-link">📊 Ir al Dashboard</a>
        <a href="agentes.html" class="nav-link">👥 Consola Agentes</a>
    </div>
</header>

<div class="form-container">
    <h2>Crear Nuevo Tiquete de Soporte</h2>
    <p style="font-size: 13px; color: #94a3b8; margin-bottom: 20px;">Envía tu incidencia al pipeline E2E de n8n.</p>
    
    <form id="ticketForm">
        <div class="form-group">
            <label for="email">Correo Electrónico del Usuario</label>
            <input type="email" id="email" required placeholder="usuario@dominio.com">
        </div>

        <div class="form-group">
            <label for="asunto">Asunto del Incidente</label>
            <input type="text" id="asunto" required placeholder="Resumen breve del problema">
        </div>

        <div class="form-group">
            <label for="descripcion">Descripción Detallada</label>
            <textarea id="descripcion" required placeholder="Explica detalladamente el fallo..."></textarea>
        </div>

        <button type="submit">Enviar Tiquete al Pipeline E2E</button>
    </form>

    <div id="mensajeExito">¡Tiquete enviado con éxito y sincronizado con la Consola de Agentes!</div>
</div>

<script>
    document.getElementById('ticketForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const asunto = document.getElementById('asunto').value;
        const descripcion = document.getElementById('descripcion').value;
        
        const idTiquete = "TKT-" + Math.floor(100000 + Math.random() * 900000);
        const fechaActual = new Date().toISOString().replace('T', ' ').substring(0, 19);

        const nuevoTiquete = {
            id: idTiquete,
            diag: asunto + ": " + descripcion,
            crit: "Alta",
            agente: "Jorge Ulloa",
            fecha: fechaActual
        };

        let listaTiquetes = JSON.parse(localStorage.getItem('tfm_tiquetes')) || [];
        listaTiquetes.unshift(nuevoTiquete);
        localStorage.setItem('tfm_tiquetes', JSON.stringify(listaTiquetes));

        try {
            await fetch('http://localhost:5678/webhook/soporte-ticket', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, asunto, descripcion, id: idTiquete })
            });
        } catch (err) {
            console.log("Nota de red n8n:", err);
        }

        document.getElementById('mensajeExito').style.display = 'block';
        document.getElementById('ticketForm').reset();

        setTimeout(() => {
            document.getElementById('mensajeExito').style.display = 'none';
        }, 4000);
    });
</script>

</body>
</html>
