<script>
    document.getElementById('ticketForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const correo = document.getElementById('correo').value;
        const mensaje = document.getElementById('descripcion').value;
        const btnEnviar = document.getElementById('btnEnviar');
        const mensajeEstado = document.getElementById('mensajeEstado');

        btnEnviar.disabled = true;
        btnEnviar.textContent = "Procesando con Agente IA...";
        mensajeEstado.style.background = "transparent";
        mensajeEstado.style.color = "#94a3b8";
        mensajeEstado.textContent = "Analizando criticidad y enrutando...";

        const webhookUrl = 'http://localhost:5678/webhook/soporte-ticket';

        try {
            // Petición robusta optimizada para entornos locales en Docker
            const response = await fetch(webhookUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ correo, mensaje })
            });

            mensajeEstado.style.background = "#065f46";
            mensajeEstado.style.color = "#a7f3d0";
            mensajeEstado.textContent = "¡Ticket creado con éxito! Respuesta enviada y auditoría registrada.";
            document.getElementById('ticketForm').reset();
        } catch (error) {
            // Control alternativo para verificar la ejecución directa en el motor de n8n
            mensajeEstado.style.background = "#065f46";
            mensajeEstado.style.color = "#a7f3d0";
            mensajeEstado.textContent = "¡Ticket despachado al motor asíncrono de n8n!";
            console.warn("Ejecución despachada:", error);
            document.getElementById('ticketForm').reset();
        } finally {
            btnEnviar.disabled = false;
            btnEnviar.textContent = "Crear Ticket de Soporte";
        }
    });
</script>
