<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniAgent Ops • Portal de Autoservicio</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { width: 100%; max-width: 800px; margin-bottom: 25px; border-bottom: 1px solid #1e293b; padding-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        h1 { color: #38bdf8; font-size: 20px; margin: 0; }
        .form-container { width: 100%; max-width: 800px; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid #334155; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #cbd5e1; font-weight: 600; }
        input, textarea { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #f8fafc; font-size: 14px; box-sizing: border-box; font-family: inherit; }
        input:focus, textarea:focus { outline: none; border-color: #38bdf8; }
        textarea { resize: vertical; height: 120px; }
        button { background-color: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s; }
        button:hover { background-color: #1d4ed8; }
        button:disabled { background-color: #475569; cursor: not-allowed; }
        .nav-links { display: flex; gap: 15px; }
        .nav-link { color: #38bdf8; text-decoration: none; font-size: 14px; font-weight: 600; }
        .nav-link:hover { text-decoration: underline; }
        .aviso { display: none; margin-top: 15px; padding: 12px; border-radius: 8px; text-align: center; font-size: 14px; font-weight: 600; }
        .aviso.ok { background: #065f46; color: #a7f3d0; }
        .aviso.error { background: #7f1d1d; color: #fecaca; }
        .ayuda { font-size: 12px; color: #94a3b8; margin-top: 6px; }
    </style>
</head>
<body>

<header>
    <h1>🌐 OmniAgent Ops • Portal de Autoservicio</h1>
    <div class="nav-links">
        <a href="dashboard.html" class="nav-link">📊 Ir al Dashboard</a>
        <a href="agentes.html" class="nav-link">👥 Consola Agentes</a>
    </div>
</header>

<div class="form-container">
    <h2>Crear Nuevo Tiquete de Soporte</h2>
    <p style="font-size: 13px; color: #94a3b8; margin-bottom: 20px;">Tu incidencia es analizada por el agente de IA y asignada al especialista correspondiente.</p>

    <form id="ticketForm">
        <div class="form-group">
            <label for="email">Correo Electrónico del Usuario</label>
            <input type="email" id="email" required placeholder="usuario@dominio.com">
        </div>

        <div class="form-group">
            <label for="asunto">Asunto del Incidente</label>
            <input type="text" id="asunto" required placeholder="Resumen breve del problema">
        </div>

        <div class="form-group">
            <label for="descripcion">Descripción Detallada</label>
            <textarea id="descripcion" required placeholder="Explica el fallo: qué ocurre, cuántas personas afecta y desde hace cuánto tiempo..."></textarea>
            <div class="ayuda">Indica cuántos usuarios están afectados y desde cuándo; ayuda a priorizar tu caso.</div>
        </div>

        <button type="submit" id="btnEnviar">Enviar Tiquete</button>
    </form>

    <div id="aviso" class="aviso"></div>
</div>

<script>
    // URL de PRODUCCIÓN del workflow de ingesta (requiere workflow publicado y ngrok activo)
    const WEBHOOK_URL = 'https://conjuror-roman-ambitious.ngrok-free.dev/webhook/ticket-soporte';

    function mostrarAviso(tipo, texto) {
        const aviso = document.getElementById('aviso');
        aviso.className = 'aviso ' + tipo;
        aviso.textContent = texto;
        aviso.style.display = 'block';
        setTimeout(() => { aviso.style.display = 'none'; }, 8000);
    }

    document.getElementById('ticketForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const boton = document.getElementById('btnEnviar');
        const correo = document.getElementById('email').value.trim();
        const asunto = document.getElementById('asunto').value.trim();
        const descripcion = document.getElementById('descripcion').value.trim();

        // El workflow espera { correo, mensaje }
        const payload = {
            correo: correo,
            mensaje: asunto + '. ' + descripcion
        };

        boton.disabled = true;
        boton.textContent = 'Enviando...';

        try {
            const resp = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'ngrok-skip-browser-warning': 'true'
                },
                body: JSON.stringify(payload)
            });

            if (!resp.ok) throw new Error('HTTP ' + resp.status);

            mostrarAviso('ok', '¡Tiquete recibido! Recibirás un correo con tu número de seguimiento en unos segundos.');
            document.getElementById('ticketForm').reset();
        } catch (err) {
            console.error('Error al enviar a n8n:', err);
            mostrarAviso('error', 'No se pudo enviar el tiquete. Verifica la conexión con el pipeline e inténtalo de nuevo.');
        } finally {
            boton.disabled = false;
            boton.textContent = 'Enviar Tiquete';
        }
    });
</script>

</body>
</html>
