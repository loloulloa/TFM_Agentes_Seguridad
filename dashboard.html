<script>
    // Configuración común para tooltips con porcentaje
    const tooltipPercentageConfig = {
        plugins: {
            tooltip: {
                callbacks: {
                    label: function(context) {
                        let label = context.label || '';
                        let value = context.raw || 0;
                        let total = context.chart.data.datasets[0].data.reduce((a, b) => a + b, 0);
                        let percentage = ((value / total) * 100).toFixed(1);
                        return `${label}: ${value} tiquetes (${percentage}%)`;
                    }
                }
            },
            legend: { position: 'right', labels: { boxWidth: 12, font: { size: 10 } } }
        }
    };

    // 1. Gráfico de Estado de Tiquetes con Porcentajes
    new Chart(document.getElementById('statusChart').getContext('2d'), {
        type: 'doughnut',
        data: {
            labels: ['New', 'Open', 'Pending', 'Hold', 'Resolved'],
            datasets: [{
                data: [3, 2, 1, 1, 4],
                backgroundColor: ['#06b6d4', '#2563eb', '#eab308', '#ef4444', '#22c55e'],
                borderWidth: 0
            }]
        },
        options: { 
            responsive: true, 
            maintainAspectRatio: false, 
            ...tooltipPercentageConfig 
        }
    });

    // 2. Gráfico de Carga por Especialista con Porcentajes
    new Chart(document.getElementById('inboxChart').getContext('2d'), {
        type: 'pie',
        data: {
            labels: ['Jorge Ulloa', 'Carlos Méndez', 'María Brenes', 'Esteban Rojas', 'Ana Lucía Gómez', 'Roberto Salas'],
            datasets: [{
                data: [3, 2, 2, 1, 1, 1],
                backgroundColor: ['#2563eb', '#38bdf8', '#9333ea', '#eab308', '#22c55e', '#ef4444'],
                borderWidth: 0
            }]
        },
        options: { 
            responsive: true, 
            maintainAspectRatio: false, 
            plugins: {
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            let label = context.label || '';
                            let value = context.raw || 0;
                            let total = context.chart.data.datasets[0].data.reduce((a, b) => a + b, 0);
                            let percentage = ((value / total) * 100).toFixed(1);
                            return `${label}: ${value} asignaciones (${percentage}%)`;
                        }
                    }
                },
                legend: { position: 'right', labels: { boxWidth: 10, font: { size: 9 } } }
            }
        }
    });

    // 3. Gráfico de Prioridad
    new Chart(document.getElementById('priorityChart').getContext('2d'), {
        type: 'bar',
        data: {
            labels: ['High', 'Normal', 'Low'],
            datasets: [{
                data: [4, 3, 2],
                backgroundColor: ['#ef4444', '#eab308', '#22c55e'],
                borderRadius: 4
            }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { grid: { color: '#f1f5f9' } } } }
    });

    // 4. Gráfico de Tiempo de Respuesta
    new Chart(document.getElementById('timeChart').getContext('2d'), {
        type: 'bar',
        data: {
            labels: ['First Response Time', 'Resolution Time'],
            datasets: [{
                data: [2, 4],
                backgroundColor: '#2563eb',
                borderRadius: 4
            }]
        },
        options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { color: '#f1f5f9' } }, y: { grid: { display: false } } } }
    });
</script>
